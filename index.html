<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rezepte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mise en Place</title>
<style>
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --surface-2:#F5EFE6; --border:#E4D8C6;
  --text:#2A1F16; --muted:#62533F;
  --accent:#C2410C; --accent-press:#9A3412; --accent-soft:#FFEDD5;
  --green:#3F6212; --green-soft:#ECFCCB;
  --danger:#B42318; --danger-soft:#FEE4E2;
  --warn:#8A3B0B; --warn-soft:#FEF3C7; --warn-border:#D97706;
  --breakfast:#92400E; --breakfast-soft:#FEF3C7;
  --lunch:#3F6212; --lunch-soft:#ECFCCB;
  --dinner:#9A3412; --dinner-soft:#FFE4D5;
  --snack:#9F1239; --snack-soft:#FFE4E6;
  --radius:14px;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
body.modal-open{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7C2D12;outline-offset:2px}
h1,h2,h3{line-height:1.2}
a{color:var(--accent-press)}

/* Header + nav */
.app-header{position:sticky;top:0;z-index:20;background:rgba(251,248,243,.97);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.header-inner{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:16px;min-height:56px}
.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;white-space:nowrap;margin:0}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{min-height:48px;border:0;background:none;border-radius:12px;padding:6px 14px;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-press)}
.nav .ico{font-size:20px;line-height:1}
@media (max-width:759px){
  .nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:30;gap:0;margin:0}
  .nav button{flex:1;flex-direction:column;gap:2px;font-size:14px;padding:6px 2px;min-width:0}
  body{padding-bottom:170px}
}
main{max-width:1180px;margin:0 auto;padding:16px}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.page-title h2{margin:0;font-size:24px}
.lead{color:var(--muted);margin:0 0 16px}

/* Buttons */
.btn{min-height:48px;padding:10px 18px;border-radius:12px;border:2px solid transparent;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;line-height:1.2}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-press)}
.btn.secondary{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn.secondary:hover{border-color:#CDBBA2}
.btn.danger{background:var(--surface);border-color:#F1B3AC;color:var(--danger)}
.btn.danger-solid{background:var(--danger);color:#fff}
.btn.ghost{background:transparent;color:var(--accent-press)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row.end{justify-content:flex-end}
.icon-btn{width:48px;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:20px;display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0}
.icon-btn.danger{color:var(--danger)}

/* FAB */
.fab{position:fixed;right:20px;bottom:24px;z-index:25;min-height:60px;padding:0 24px;border-radius:999px;background:var(--accent);color:#fff;border:0;font-weight:800;font-size:18px;box-shadow:0 6px 20px rgba(154,52,18,.35);display:flex;align-items:center;gap:8px}
.fab:hover{background:var(--accent-press)}
.fab .plus{font-size:28px;line-height:1}
@media (max-width:759px){.fab{bottom:calc(88px + env(safe-area-inset-bottom));right:16px}}
body.modal-open .fab{display:none}

/* Workflow strip */
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface-2);border-radius:var(--radius);padding:10px 12px;margin-bottom:16px}
.flow-step{min-height:44px;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-weight:700;color:var(--text)}
.flow-arrow{color:var(--muted);font-weight:800}
.backup-hint{background:var(--warn-soft);border:2px solid var(--warn-border);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Search + chips */
.search{position:relative;margin-bottom:10px}
.search .s-ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;pointer-events:none}
.search input[type=search]{width:100%;min-height:56px;padding:12px 16px 12px 50px;border:2px solid var(--border);border-radius:14px;background:var(--surface);font-size:18px}
.search input:focus{border-color:var(--accent);outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.chip{min-height:44px;padding:8px 16px;border-radius:999px;border:2px solid var(--border);background:var(--surface);font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:#fff;border-color:var(--text)}
.chip.folder[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.chip.add{border-style:dashed;color:var(--accent-press)}
.chip .n{opacity:.75;font-weight:600;margin-left:4px}
.count-line{color:var(--muted);font-weight:700;margin:4px 0 12px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);width:100%;color:var(--text)}
.card:hover{border-color:#CDBBA2}
.card-img{aspect-ratio:16/10;display:grid;place-items:center;font-size:64px;position:relative;width:100%}
.card-img img,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.planned-pill,.src-pill{position:absolute;top:10px;background:rgba(255,255,255,.95);color:var(--text);font-size:14px;font-weight:800;padding:4px 10px;border-radius:999px;box-shadow:var(--shadow)}
.planned-pill{left:10px} .src-pill{right:10px}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;width:100%}
.card h3{margin:0;font-size:19px}
.meta{display:flex;gap:14px;color:var(--muted);font-weight:700;font-size:16px;flex-wrap:wrap;align-items:center}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:14px;font-weight:800;background:var(--surface-2);color:var(--text)}
.badge.breakfast{background:var(--breakfast-soft);color:var(--breakfast)}
.badge.lunch{background:var(--lunch-soft);color:var(--lunch)}
.badge.dinner{background:var(--dinner-soft);color:var(--dinner)}
.badge.snack{background:var(--snack-soft);color:var(--snack)}
.badge.folder{background:var(--accent-soft);color:var(--accent-press)}
.tags{display:flex;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--muted);font-weight:600}
.diff{display:inline-flex;align-items:center;gap:6px}
.dots{letter-spacing:1px;font-size:13px}
.diff-easy .dots{color:var(--green)} .diff-medium .dots{color:#B45309} .diff-hard .dots{color:var(--danger)}
.empty{text-align:center;padding:40px 16px;background:var(--surface);border:2px dashed var(--border);border-radius:var(--radius)}
.empty .big{font-size:48px}

/* Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(42,31,22,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:760px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.modal.sheet{height:96vh;height:96dvh}
.modal.small{max-width:460px}
@media (min-width:760px){.modal-backdrop{align-items:center;padding:16px}.modal{border-radius:20px;max-height:92vh}.modal.sheet{height:92vh}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--surface);flex:none}
.sheet-head h2{font-size:19px;margin:0;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-body{overflow-y:auto;padding:16px;flex:1;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--surface);flex:none;flex-wrap:wrap}
.sheet-foot .btn{flex:1}
.confirm-title{margin:0 0 8px;font-size:21px}
.spinner{width:48px;height:48px;border-radius:50%;border:5px solid var(--accent-soft);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:8px auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Detail */
.hero{aspect-ratio:16/7;display:grid;place-items:center;font-size:84px;position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.detail-title{margin:0 0 8px;font-size:26px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;font-weight:600;color:var(--muted)}
.stat b{display:block;font-size:20px;color:var(--text)}
.section-h{font-size:20px;margin:22px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.section-h .seg{margin-left:auto}
.ing-view{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--border);border-radius:12px}
.ing-view li{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);font-size:18px;flex-wrap:wrap}
.ing-view li:last-child{border-bottom:0}
.ing-view .q{font-weight:800;min-width:92px}
.ing-view .note{color:var(--muted)}
.ing-view .approx{display:block;width:100%;font-size:15px;color:var(--warn);font-weight:700}
.steps-view{list-style:none;padding:0;margin:0}
.steps-view li{display:grid;grid-template-columns:40px 1fr;gap:12px;margin-bottom:14px;font-size:18px}
.steps-view .n{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center}
.planned-note{background:var(--green-soft);color:var(--green);font-weight:700;padding:10px 14px;border-radius:12px;margin:8px 0}
.mode-toggle{display:inline-flex;border:2px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.mode-toggle button{border:0;background:none;min-height:44px;padding:6px 12px;font-weight:700;font-size:15px;color:var(--muted)}
.mode-toggle button[aria-pressed="true"]{background:var(--text);color:#fff}

/* Form */
.field{margin-bottom:18px;border-radius:12px}
.field>label,.flabel{display:block;font-weight:800;margin-bottom:6px}
.req{color:var(--danger)}
.opt{color:var(--muted);font-weight:600}
input[type=text],input[type=url],input[type=search],input[type=password],input:not([type]),input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:2px solid var(--border);border-radius:10px;background:var(--surface);font-size:17px}
textarea{min-height:84px;resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.invalid input,.invalid textarea,.invalid select{border-color:var(--danger)!important}
.err{color:var(--danger);font-weight:700;margin:6px 0 0;font-size:15px}
.err:empty{display:none}
.field.flagged,.ing-row.flagged,.step-row.flagged{background:var(--warn-soft);outline:2px dashed var(--warn-border);outline-offset:3px}
.field.flagged{padding:8px}
.flag-badge{display:none;background:var(--warn-border);color:#fff;font-size:14px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle}
.flagged>label .flag-badge,.flagged>.flabel .flag-badge,.flagged>.section-head .flag-badge{display:inline-block}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:90px;min-height:48px;border:2px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;background:var(--surface);padding:6px 10px;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--text);color:#fff;border-color:var(--text)}
.seg label:has(input:checked) .dots{color:#fff}
.seg label:has(input:focus-visible){outline:3px solid #7C2D12;outline-offset:2px}
.seg.folders label{flex:0 1 auto}
.seg.folders label:has(input:checked){background:var(--accent);border-color:var(--accent)}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.section-head h3{margin:0;font-size:20px}
.ing-list,.step-list{padding:0;margin:0 0 10px;list-style:none}
.ing-row{display:grid;grid-template-columns:84px 118px 1fr 48px;gap:8px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.ing-orig{grid-column:1/-1;font-size:15px;color:var(--muted);font-weight:600;margin:0;display:flex;gap:6px;align-items:baseline}
.ing-orig:empty{display:none}
.ing-orig b{color:var(--text)}
.ing-extra{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{display:block;font-size:14px;color:var(--muted);font-weight:800;margin-bottom:2px}
.row-flag,.row-err{grid-column:1/-1;margin:0;font-weight:700;font-size:15px}
.row-flag{color:var(--warn)} .row-err{color:var(--danger)}
.row-err:empty,.row-flag:empty{display:none}
@media (max-width:560px){
  .ing-row{grid-template-columns:84px 1fr 48px}
  .ing-row .i-name{grid-column:1/-1;grid-row:3}
  .ing-extra{grid-template-columns:1fr}
}
.step-row{display:grid;grid-template-columns:52px 1fr 48px;gap:8px;align-items:start;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:10px}
.step-row .row-err{grid-column:2/-1}
.drag-handle{width:52px;min-height:72px;border-radius:10px;border:0;background:var(--surface-2);cursor:grab;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;color:var(--text);user-select:none;-webkit-user-select:none}
.drag-handle .num{font-size:20px}
.drag-handle .grip{font-size:18px;color:var(--muted);line-height:1}
.step-row.dragging{box-shadow:0 12px 28px rgba(0,0,0,.2);border-color:var(--accent);position:relative;z-index:2}
.step-row.dragging .drag-handle{cursor:grabbing;background:var(--accent);color:#fff}
.banner{padding:12px 14px;border-radius:12px;margin-bottom:16px;font-weight:600}
.banner.warn{background:var(--warn-soft);color:var(--warn);border:2px solid var(--warn-border)}
.banner.error{background:var(--danger-soft);color:var(--danger);border:2px solid #F1B3AC}
.banner.ok{background:var(--green-soft);color:var(--green);border:2px solid #A3C76A}
.banner ul{margin:6px 0 0;padding-left:20px}
.fill-box{background:var(--surface);border:2px dashed var(--warn-border);border-radius:12px;padding:12px;margin-bottom:12px}
.fill-box p{margin:0 0 8px;font-weight:700;color:var(--warn)}
.emoji-pick{display:flex;gap:6px;flex-wrap:wrap}
.emoji-pick label{width:48px;height:48px;border:2px solid var(--border);border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--surface);position:relative}
.emoji-pick input{position:absolute;opacity:0;pointer-events:none}
.emoji-pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}

/* Planner */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .summary{font-weight:700;color:var(--muted);margin-right:auto}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.day{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.day h3{margin:0 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:center}
.day h3 small{font-size:14px;color:var(--muted);font-weight:700}
.slot{margin-bottom:10px}
.slot:last-child{margin-bottom:0}
.slot-label{font-size:14px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.slot-label.breakfast{color:var(--breakfast)} .slot-label.lunch{color:var(--lunch)} .slot-label.dinner{color:var(--dinner)}
.slot-box{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--surface-2);padding:4px;border-radius:12px;border-left:6px solid var(--border)}
.slot-box.breakfast{border-left-color:#D97706} .slot-box.lunch{border-left-color:#65A30D} .slot-box.dinner{border-left-color:#C2410C}
.slot-main{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:6px;min-height:56px;border-radius:10px;min-width:0}
.slot-emoji{font-size:30px;flex:none}
.slot-text{min-width:0}
.slot-text strong{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.slot-meta{display:block;font-size:15px;color:var(--muted);font-weight:600}
.slot-actions{display:flex;gap:4px}
.slot-actions .icon-btn{width:44px;height:44px}
.slot-empty{width:100%;min-height:60px;border:2px dashed #D6C6AF;background:transparent;border-radius:12px;color:var(--muted);font-weight:800;font-size:17px}
.slot-empty:hover{border-color:var(--accent);color:var(--accent-press);background:var(--accent-soft)}
.pick-group{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:14px 0 8px}
.pick-item{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 12px;border:1px solid var(--border);background:var(--surface);border-radius:12px;margin-bottom:8px;text-align:left}
.pick-item:hover{border-color:var(--accent)}
.pick-item .slot-emoji{font-size:32px}
.pick-item .used{color:var(--warn);font-weight:700;font-size:15px;display:block}

/* Grocery */
.progress{height:12px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin:4px 0 18px;border:1px solid var(--border)}
.progress span{display:block;height:100%;background:var(--green);border-radius:999px}
.aisle{margin-bottom:20px}
.aisle h3{display:flex;gap:8px;align-items:center;font-size:19px;margin:0 0 8px}
.aisle h3 .cnt{font-size:15px;color:var(--muted)}
.g-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;list-style:none;margin:0;padding:0}
.g-list li{border-bottom:1px solid var(--border)}
.g-list li:last-child{border-bottom:0}
.g-item{display:flex;align-items:center;gap:14px;min-height:58px;padding:10px 14px;cursor:pointer}
.g-item input{width:28px;height:28px;accent-color:var(--green);flex:none;margin:0}
.g-main{flex:1;min-width:0}
.g-qty{font-weight:800;margin-right:6px}
.g-name{font-weight:600}
.g-src{display:block;font-size:15px;color:var(--muted)}
.g-item.done .g-qty,.g-item.done .g-name{text-decoration:line-through;color:var(--muted)}
.export textarea{font:15px/1.5 ui-monospace,Consolas,monospace;min-height:240px;background:#FFFCF7}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
@media (max-width:900px){.two-col{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 10px}
.panel>p:first-of-type{margin-top:0}

/* Import + settings */
.report{list-style:none;padding:0;margin:0}
.report li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.report li:last-child{border-bottom:0}
.report .ic{font-size:20px;width:28px;flex:none}
.hint-list{margin:0;padding-left:20px}
.hint-list li{margin-bottom:8px}
.guide{counter-reset:g;list-style:none;padding:0;margin:0}
.guide>li{counter-increment:g;position:relative;padding:0 0 16px 46px}
.guide>li::before{content:counter(g);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center}
.copy-row{display:flex;gap:8px;align-items:stretch;margin-top:6px}
.copy-row code{flex:1;min-width:0;background:#2A1F16;color:#FDF3E4;padding:10px 12px;border-radius:10px;font:14px/1.45 ui-monospace,Consolas,monospace;word-break:break-all;display:block}
details.panel summary{font-weight:800;font-size:18px;cursor:pointer;min-height:44px;display:flex;align-items:center}
pre.code{background:#2A1F16;color:#FDF3E4;padding:16px;border-radius:12px;overflow:auto;font:14px/1.5 ui-monospace,Consolas,monospace;max-height:60vh;margin:10px 0 0}
.key-row{display:flex;gap:8px}
.key-row input{flex:1}
.status-dot{font-weight:800}
.status-dot.ok{color:var(--green)} .status-dot.no{color:var(--danger)}

/* Toast */
.toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--text);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:100;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:759px){.toast{bottom:170px}}

function uid(){ return (Math.random().toString(36).slice(2, 10) + Date.now().toString(36)).slice(0, 16); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function guessAisle(name){
  const n = ' ' + String(name || '').toLowerCase() + ' ';
  for (const [aisle, words] of AISLE_RULES) if (words.some(w => n.includes(w))) return aisle;
  return 'Other';
}
function platformOf(url){
  const u = String(url || '').toLowerCase();
  if (/youtu\.?be/.test(u)) return 'youtube';
  if (u.includes('instagram.com')) return 'instagram';
  if (u.includes('tiktok.com')) return 'tiktok';
  return u ? 'web' : '';
}

/* =========================================================
   MENGEN & UMRECHNUNG
   ========================================================= */
const FRAC = {'½':.5,'⅓':1/3,'⅔':2/3,'¼':.25,'¾':.75,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
function parseQtyStr(str){
  const s = String(str).trim().replace(',', '.');
  let m;
  if ((m = s.match(/^(\d+(?:\.\d+)?)\s+(\d+)\/(\d+)$/))) return +m[2] && +m[3] ? +m[1] + m[2] / m[3] : NaN;
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return +m[2] ? m[1] / m[2] : NaN;
  if ((m = s.match(/^(\d+(?:\.\d+)?)?\s*([½⅓⅔¼¾⅛⅜⅝⅞])$/))) return (m[1] ? +m[1] : 0) + FRAC[m[2]];
  if (/^\d*\.?\d+$/.test(s)) return +s;
  return NaN;
}
function fmtQty(n){
  if (n == null || isNaN(n)) return '';
  const w = Math.floor(n + 1e-9), f = n - w;
  for (const [v, s] of [[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[1/2,'½'],[2/3,'⅔'],[3/4,'¾'],[1,'']]) {
    if (Math.abs(f - v) < 0.02) return v === 1 ? String(w + 1) : v === 0 ? String(w) : (w || '') + s;
  }
  return String(Math.round(n * 100) / 100).replace('.', ',');
}
function unitLabel(id, q){ const u = UNIT[id] || UNIT.pc; if (u.id === 'pc') return ''; return q > 1 && u.plural ? u.plural : u.label; }
function qtyUnit(q, id){ if (id === 'taste') return 'nach Geschmack'; if (q == null) return 'nach Bedarf'; return [fmtQty(q), unitLabel(id, q)].filter(Boolean).join(' '); }
function composeLine(i){ return [i.unit === 'taste' || i.quantity == null ? '' : qtyUnit(i.quantity, i.unit), i.name].filter(Boolean).join(' ') + (i.note ? ', ' + i.note : '') + (i.unit === 'taste' ? ' (nach Geschmack)' : ''); }

// Gramm pro US-Cup (240 ml). Reihenfolge zählt: spezifische Begriffe zuerst.
const DENSITY = [
  [['peanut butter','erdnussbutter'],260], [['icing sugar','powdered sugar','puderzucker'],120], [['brown sugar','brauner zucker','rohrzucker'],220],
  [['flour','mehl'],125], [['cornstarch','cornflour','speisestärke','stärke'],120], [['sugar','zucker'],200], [['butter'],227],
  [['oat','haferflocken'],90], [['rice','reis'],185], [['cocoa','kakao'],85], [['honey','honig','syrup','sirup'],340],
  [['parmesan','grated cheese','geriebener käse','cheese','käse'],100], [['almond','mandel','nut','nuss','nüsse'],140],
  [['chocolate chip','schokotropfen'],170], [['breadcrumb','panko','paniermehl','semmelbrösel'],110],
  [['yogurt','yoghurt','joghurt','quark'],245], [['quinoa'],170], [['lentil','linse'],190], [['coconut flakes','kokosraspeln'],80],
  [['blueberr','heidelbeer','raspberr','himbeer','berries','beeren'],145], [['spinach','spinat'],30], [['crouton'],30],
  [['granola','müsli'],120], [['chia'],170], [['raisin','rosine'],150], [['pasta','nudel'],100], [['parsley','petersilie','basil','basilikum','cilantro','koriander'],20]
];
const LIQUID = ['milk','milch','water','wasser','stock','broth','brühe','fond','oil','öl','cream','sahne','wine','wein','vinegar','essig','juice','saft','sauce','soße','soy','soja','coconut milk','kokosmilch','buttermilk','buttermilch','beer','bier','dressing','espresso','coffee','kaffee'];
function isLiquid(name){ const n = name.toLowerCase(); return LIQUID.some(w => n.includes(w)) && !/peanut butter|erdnussbutter/.test(n); }
function density(name){ const n = name.toLowerCase(); for (const [ws, g] of DENSITY) if (ws.some(w => n.includes(w))) return g; return null; }
function roundMetric(q){ return q < 10 ? Math.round(q * 10) / 10 : q < 100 ? Math.round(q) : Math.round(q / 5) * 5; }
/* Liefert {q, u, approx} in metrischen Einheiten; EL/TL bleiben EL/TL. */
function toMetric(i){
  const q = i.quantity, u = i.unit, name = i.name || '';
  if (q == null) return {q, u};
  if (u === 'cup') {
    if (isLiquid(name)) return {q:roundMetric(q * 240), u:'ml'};
    const d = density(name);
    if (d) return {q:roundMetric(q * d), u:'g', approx:'umgerechnet von ' + fmtQty(q) + ' ' + unitLabel('cup', q)};
    return {q:roundMetric(q * 240), u:'ml', approx:'Volumen, Gewicht unbekannt'};
  }
  if (u === 'floz') return {q:roundMetric(q * 29.57), u:'ml'};
  if (u === 'oz') return {q:roundMetric(q * 28.35), u:'g'};
  if (u === 'lb') return {q:roundMetric(q * 453.6), u:'g'};
  if (u === 'stick') return {q:roundMetric(q * 113), u:'g'};
  return {q, u};
}
function bigUnit(m){ if (m.u === 'g' && m.q >= 1000) return {...m, q:Math.round(m.q / 10) / 100, u:'kg'}; if (m.u === 'ml' && m.q >= 1000) return {...m, q:Math.round(m.q / 10) / 100, u:'l'}; return m; }
function fToC(text){ return String(text).replace(/(?<![(\d])(\d{3})\s*°\s*F\b(?!\s*\(?\s*\d{2,3}\s*°?\s*C)/g, (m, f) => `${m} (${Math.round((f - 32) * 5 / 9 / 5) * 5} °C)`); }

function migrate(s){
  const plan = emptyPlan();
  for (const [d] of DAYS) for (const m of MEALS) plan[d][m] = (s.plan && s.plan[d] && s.plan[d][m]) || null;
  const recipes = s.recipes.map(r => ({...r, folderIds:r.folderIds || [], sourcePlatform:r.sourcePlatform || platformOf(r.sourceUrl),
    ingredients:r.ingredients.map(i => ({...i, original:i.original || composeLine(i)}))}));
  return {version:VERSION, recipes, folders:s.folders || [], plan, checked:s.checked || {}, settings:Object.assign(defaultSettings(), s.settings || {})};
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (!s || !Array.isArray(s.recipes)) return null; return migrate(s); }
  catch { return null; }
}
let saveFailed = false;
function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); saveFailed = false; }
  catch { if (!saveFailed) toast('⚠ Speichern im Browser fehlgeschlagen – bitte Backup exportieren.'); saveFailed = true; }
}

const byId = id => state.recipes.find(r => r.id === id);
const folderById = id => state.folders.find(f => f.id === id);
const totalMin = r => (r.prepMinutes || 0) + (r.cookMinutes || 0);
function fmtMin(m){ if (!m) return '0 Min.'; const h = Math.floor(m / 60), mm = m % 60; return h ? `${h} Std.${mm ? ' ' + mm + ' Min.' : ''}` : `${mm} Min.`; }
function plannedIn(id){ const out = []; for (const [d, name] of DAYS) for (const m of MEALS) if (state.plan[d][m] === id) out.push(`${name.slice(0, 2)} ${MEAL_LABEL[m]}`); return out; }
function plannedCount(){ let n = 0; for (const [d] of DAYS) for (const m of MEALS) if (byId(state.plan[d][m])) n++; return n; }
function heroBg(seed){ let h = 0; for (const c of String(seed)) h = (h * 31 + c.charCodeAt(0)) % 360; return `linear-gradient(135deg,hsl(${20 + h % 30},80%,90%),hsl(${35 + h % 25},75%,84%))`; }
function visual(r, cls){ return `<div class="${cls}" style="background:${heroBg(r.id)}"><span aria-hidden="true">${esc(r.emoji || '🍽️')}</span>${r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}`; }
function diffHtml(d){ const n = DIFFS.indexOf(d) + 1; return `<span class="diff diff-${d}"><span class="dots" aria-hidden="true">${'●'.repeat(n)}${'○'.repeat(3 - n)}</span>${DIFF_LABEL[d] || d}</span>`; }
function mealBadges(r){ return (r.mealTypes || []).map(m => `<span class="badge ${m}">${MEAL_ICON[m]} ${MEAL_LABEL[m]}</span>`).join(''); }
function folderBadges(r){ return (r.folderIds || []).map(folderById).filter(Boolean).map(f => `<span class="badge folder">${esc(f.emoji)} ${esc(f.name)}</span>`).join(''); }

function backupHint(){
  const last = state.settings.lastBackup ? new Date(state.settings.lastBackup) : null;
  const days = last ? (Date.now() - last) / 864e5 : Infinity;
  const seedIds = ['shrimp01','oats0001','caesar01','omelet01','parfait1','pasta001','lentil01'];
  if (!state.recipes.some(r => !seedIds.includes(r.id)) || days < 14) return '';
  return `<div class="backup-hint">💾 ${last ? `Letztes Backup vor ${Math.floor(days)} Tagen.` : 'Noch kein Backup.'} Safari kann Website-Daten löschen.
    <button class="btn secondary" data-action="export-backup">Jetzt sichern</button></div>`;
}

  </div>
  <div id="lib-results">${libraryResults()}</div>`;

function filteredRecipes(){
  const terms = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
  return state.recipes.filter(r => {
    if (ui.folder !== 'all' && !(r.folderIds || []).includes(ui.folder)) return false;
    if (ui.meal !== 'all' && !(r.mealTypes || []).includes(ui.meal)) return false;
    if (ui.quick && totalMin(r) > 20) return false;
    if (!terms.length) return true;
    const hay = [r.title, r.description, ...(r.tags || []), ...(r.mealTypes || []).map(m => MEAL_LABEL[m]), ...r.ingredients.map(i => i.name + ' ' + (i.original || ''))].join(' ').toLowerCase();
    return terms.every(t => hay.includes(t));
  }).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '') || a.title.localeCompare(b.title));
}
function libraryResults(){
  const list = filteredRecipes();
  if (!list.length) return `<div class="empty"><div class="big" aria-hidden="true">🥄</div><p><strong>Keine passenden Rezepte.</strong></p>
    <div class="btn-row" style="justify-content:center"><button class="btn secondary" data-action="clear-filters">Filter zurücksetzen</button><button class="btn primary" data-action="nav" data-view="import">📥 Rezept importieren</button></div></div>`;
  return `<p class="count-line">${list.length} Rezept${list.length === 1 ? '' : 'e'}</p><div class="grid">${list.map(card).join('')}</div>`;
}
function card(r){
  const p = plannedIn(r.id), pf = PLATFORMS[r.sourcePlatform];
  return `<button class="card" data-action="view-recipe" data-id="${esc(r.id)}" aria-label="${esc(r.title)}">
    ${visual(r, 'card-img')}${p.length ? `<span class="planned-pill">📅 ${esc(p[0].split(' ')[0])}${p.length > 1 ? ' +' + (p.length - 1) : ''}</span>` : ''}${pf && r.sourcePlatform !== 'web' ? `<span class="src-pill">${pf.icon} ${pf.label}</span>` : ''}</div>
    <div class="card-body">
      <h3>${esc(r.title)}</h3>
      <div class="meta"><span>⏱ ${fmtMin(totalMin(r))}</span>${diffHtml(r.difficulty)}</div>
      ${(r.mealTypes || []).length || (r.folderIds || []).length ? `<div class="badges">${mealBadges(r)}${folderBadges(r)}</div>` : ''}
      ${r.tags && r.tags.length ? `<div class="tags">${r.tags.slice(0, 3).map(t => `<span>#${esc(t)}</span>`).join('')}</div>` : ''}
    </div></button>`;
}

function wireForm(form){
  const stepList = form.querySelector('#step-list');
  form.addEventListener('submit', e => { e.preventDefault(); saveForm(form); });
  form.addEventListener('input', e => {
    const fl = e.target.closest('.flagged'); if (fl && !e.target.closest('#fill-box')) { fl.classList.remove('flagged'); const rf = fl.querySelector('.row-flag'); if (rf) rf.textContent = ''; }
    const inv = e.target.closest('.invalid'); if (inv) { inv.classList.remove('invalid'); const er = inv.querySelector(':scope > .err, :scope > .row-err'); if (er) er.textContent = ''; }
    if (e.target.classList.contains('i-name')) { const sel = e.target.closest('.ing-row').querySelector('.i-aisle'); if (sel.dataset.auto === '1') sel.value = guessAisle(e.target.value); }
  });
  form.addEventListener('change', e => {
    if (e.target.classList.contains('i-aisle')) e.target.dataset.auto = '0';
    const fl = e.target.closest('.field.flagged'); if (fl) fl.classList.remove('flagged');
  });
  stepList.addEventListener('pointerdown', e => {
    const h = e.target.closest('.drag-handle'); if (!h || e.button > 0) return;
    e.preventDefault();
    const row = h.closest('.step-row'), scroller = form.querySelector('.sheet-body');
    try { h.setPointerCapture(e.pointerId); } catch {}
    row.classList.add('dragging');
    let lastY = e.clientY, raf;
    const place = () => {
      const rows = [...stepList.children].filter(r => r !== row);
      const before = rows.find(r => { const b = r.getBoundingClientRect(); return lastY < b.top + b.height / 2; }) || null;
      if (row.nextElementSibling !== before) stepList.insertBefore(row, before);
      const sb = scroller.getBoundingClientRect();
      if (lastY < sb.top + 60) scroller.scrollTop -= 12; else if (lastY > sb.bottom - 60) scroller.scrollTop += 12;
    };
    const tick = () => { place(); raf = requestAnimationFrame(tick); };
    raf = requestAnimationFrame(tick);
    const move = ev => { lastY = ev.clientY; };
    const up = ev => {
      cancelAnimationFrame(raf); if (ev && ev.clientY != null) { lastY = ev.clientY; place(); }
      row.classList.remove('dragging'); renumber(stepList);
      window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  });
  stepList.addEventListener('keydown', e => {
    const h = e.target.closest('.drag-handle'); if (!h || !['ArrowUp','ArrowDown'].includes(e.key)) return;
    e.preventDefault();
    const row = h.closest('.step-row');
    if (e.key === 'ArrowUp' && row.previousElementSibling) stepList.insertBefore(row, row.previousElementSibling);
    if (e.key === 'ArrowDown' && row.nextElementSibling) stepList.insertBefore(row.nextElementSibling, row);
    renumber(stepList); h.focus();
  });
}

function validateRecipe(r){
  const e = [];
  if (!r.title) e.push({path:'title', msg:'Gib dem Rezept einen Titel.'});
  if (!Number.isInteger(r.servings) || r.servings < 1 || r.servings > 100) e.push({path:'servings', msg:'Portionen: ganze Zahl von 1 bis 100.'});
  for (const k of ['prepMinutes','cookMinutes']) if (!Number.isInteger(r[k]) || r[k] < 0 || r[k] > 1440) e.push({path:k, msg:'Minuten: ganze Zahl von 0 bis 1440.'});
  if (!DIFFS.includes(r.difficulty)) e.push({path:'difficulty', msg:'Wähle eine Schwierigkeit.'});
  if (r.image && !/^(https?:\/\/|data:image\/)/i.test(r.image)) e.push({path:'image', msg:'Foto-Link muss mit http:// oder https:// beginnen.'});
  if (!r.ingredients.length) e.push({path:'ingredients', msg:'Mindestens eine Zutat eintragen.'});
  r.ingredients.forEach((ing, i) => {
    if (!ing.name) e.push({path:`ingredients.${i}`, msg:'Name der Zutat fehlt.'});
    else if (ing.quantity !== null && (!(ing.quantity > 0) || ing.quantity > 10000)) e.push({path:`ingredients.${i}`, msg:'Menge als Zahl angeben, z. B. 1,5 oder 1/2.'});
  });
  if (!r.steps.length) e.push({path:'steps', msg:'Mindestens einen Zubereitungsschritt eintragen.'});
  return e;
}
function readForm(form){
  const v = n => (form.elements[n] && form.elements[n].value || '').trim();
  const int = (n, dflt) => { const s = v(n); return s === '' ? dflt : (/^\d+$/.test(s) ? +s : NaN); };
  const ingRows = [...form.querySelectorAll('.ing-row')].filter(li => li.querySelector('.i-qty').value.trim() || li.querySelector('.i-name').value.trim() || li.querySelector('.i-note').value.trim());
  const ingredients = ingRows.map(li => {
    const qRaw = li.querySelector('.i-qty').value.trim();
    const ing = {id:li.dataset.id, quantity:qRaw ? parseQtyStr(qRaw) : null, unit:li.querySelector('.i-unit').value,
      name:li.querySelector('.i-name').value.trim(), note:li.querySelector('.i-note').value.trim(), aisle:li.querySelector('.i-aisle').value};
    ing.original = li.dataset.original || composeLine(ing);
    return ing;
  });
  const steps = [...form.querySelectorAll('.step-row')].map(li => ({id:li.dataset.id, text:li.querySelector('.s-text').value.trim()})).filter(s => s.text);
  const tags = [...new Set(v('tags').split(',').map(t => t.trim().replace(/^#/, '').toLowerCase()).filter(Boolean))].slice(0, 12).map(t => t.slice(0, 30));
  const now = new Date().toISOString();
  return {
    rec:{id:form.dataset.id || uid(), title:v('title'), description:v('description'), emoji:(form.querySelector('input[name=emoji]:checked') || {}).value || '🍽️',
      image:v('image'), servings:int('servings', NaN), prepMinutes:int('prepMinutes', 0), cookMinutes:int('cookMinutes', 0),
      difficulty:(form.querySelector('input[name=difficulty]:checked') || {}).value || '',
      mealTypes:[...form.querySelectorAll('input[name=mealTypes]:checked')].map(i => i.value),
      folderIds:[...form.querySelectorAll('input[name=folderIds]:checked')].map(i => i.value), tags, ingredients, steps,
      sourceUrl:form.dataset.source || '', sourcePlatform:form.dataset.platform || '', createdAt:form.dataset.created || now, updatedAt:now},
    ingRows
  };
}
function saveForm(form){
  form.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));
  form.querySelectorAll('.err, .row-err').forEach(el => el.textContent = '');
  const {rec, ingRows} = readForm(form);
  const errors = validateRecipe(rec);
  const box = form.querySelector('#form-errors');
  if (errors.length) {
    let firstEl = null;
    for (const er of errors) {
      let el;
      const m = er.path.match(/^ingredients\.(\d+)$/);
      if (m) { el = ingRows[+m[1]]; el.querySelector('.row-err').textContent = er.msg; }
      else { el = form.querySelector(`.field[data-field="${er.path}"]`); if (el) el.querySelector('.err').textContent = er.msg; }
      if (el) { el.classList.add('invalid'); firstEl = firstEl || el; }
    }
    box.hidden = false;
    box.innerHTML = `⚠ Noch nicht speicherbar – ${errors.length} Punkt${errors.length > 1 ? 'e' : ''} offen:<ul>${[...new Set(errors.map(e => e.msg))].map(m => `<li>${esc(m)}</li>`).join('')}</ul>`;
    form.querySelector('.sheet-body').scrollTop = 0;
    if (firstEl) { const f = firstEl.querySelector('input, textarea'); if (f) f.focus({preventScroll:true}); }
    return;
  }
  box.hidden = true;
  const idx = state.recipes.findIndex(r => r.id === rec.id);
  if (idx >= 0) state.recipes[idx] = rec; else state.recipes.push(rec);
  if (rec.folderIds.length) state.settings.lastFolderIds = rec.folderIds;
  save(); closeModal(); render();
  toast(`✅ „${rec.title}“ gespeichert`);
}

function autoFill(){
  const used = new Set();
  for (const [d] of DAYS) for (const m of MEALS) if (byId(state.plan[d][m])) used.add(state.plan[d][m]);
  let filled = 0; const missing = {breakfast:0, lunch:0, dinner:0};
  for (const [d] of DAYS) for (const m of MEALS) {
    if (byId(state.plan[d][m])) continue;
    const cands = state.recipes.filter(r => (r.mealTypes || []).includes(m) && !used.has(r.id));
    if (!cands.length) { missing[m]++; continue; }
    const minFlex = Math.min(...cands.map(r => r.mealTypes.length));
    const pool = cands.filter(r => r.mealTypes.length === minFlex);
    const pick = pool[Math.floor(Math.random() * pool.length)];
    state.plan[d][m] = pick.id; used.add(pick.id); filled++;
  }
  save(); render();
  const short = Object.entries(missing).filter(([, n]) => n).map(([m, n]) => `${n}× ${MEAL_LABEL[m]}`);
  toast(filled ? `✨ ${filled} Platz${filled > 1 ? 'e' : ''} gefüllt.${short.length ? ` Zu wenig verschiedene Rezepte für ${short.join(', ')} – keine Wiederholungen.` : ''}`
               : (short.length ? `Keine unbenutzten Rezepte mehr für ${short.join(', ')}. Mehr Rezepte anlegen oder markieren.` : 'Alle Plätze sind schon geplant.'));
}

/* ---------- Einkaufsliste ---------- */
function normName(n){
  const s = String(n || '').toLowerCase().replace(/\([^)]*\)/g, '').replace(/[^a-z0-9äöüß\s-]/g, ' ').replace(/\s+/g, ' ').trim();
  return s.replace(/(\w+)$/, w => /ies$/.test(w) ? w.slice(0, -3) + 'y' : /(oes|ches|shes)$/.test(w) ? w.slice(0, -2) : /[^su]s$/.test(w) ? w.slice(0, -1) : w);
}
function sumEntries(entries){
  const groups = new Map(); let taste = false, asNeeded = false;
  for (const e of entries) {
    const u = UNIT[e.u] || UNIT.pc;
    if (u.id === 'taste') { taste = true; continue; }
    if (e.q == null) { asNeeded = true; continue; }
    const fam = u.fam || u.id;
    if (!groups.has(fam)) groups.set(fam, []);
    groups.get(fam).push({q:e.q, u});
  }
  const parts = [];
  for (const [fam, list] of groups) {
    const units = new Set(list.map(x => x.u.id));
    if (units.size === 1) { const m = bigUnit({q:list.reduce((a, x) => a + x.q, 0), u:list[0].u.id}); parts.push(qtyUnit(Math.round(m.q * 100) / 100, m.u)); continue; }
    const base = list.reduce((a, x) => a + x.q * x.u.f, 0);
    const sys = new Set(list.map(x => x.u.sys));
    let id;
    if (fam === 'mass') id = sys.has('m') ? (base >= 1000 ? 'kg' : 'g') : (base >= 453.592 ? 'lb' : 'oz');
    else if (sys.has('m') || sys.has('i')) id = base >= 1000 ? 'l' : 'ml';
    else id = base >= 14.7 ? 'tbsp' : 'tsp';
    let q = base / UNIT[id].f;
    q = (id === 'g' || id === 'ml') ? roundMetric(q) : Math.round(q * 100) / 100;
    parts.push(qtyUnit(q, id));
  }
  if (asNeeded) parts.push('nach Bedarf');
  if (taste) parts.push('nach Geschmack');
  return parts.join(' + ');
}
function buildGrocery(){
  const map = new Map(); const recipesUsed = new Set();
  const metric = state.settings.unitMode === 'metric';
  for (const [d] of DAYS) for (const m of MEALS) {
    const r = byId(state.plan[d][m]); if (!r) continue;
    recipesUsed.add(r.id);
    for (const ing of r.ingredients) {

  report.push({ok:!!d.title, label:'Titel', detail:d.title || 'nicht gefunden'});
  report.push({ok:d.ingredients.length > 0 && !bad, label:'Zutaten', detail:`${d.ingredients.length} erkannt${bad ? ` · ${bad} unsicher` : ''}`});
  report.push({ok:d.steps.length > 0, label:'Zubereitung', detail:d.steps.length ? `${d.steps.length} Schritte` : 'fehlt'});
  return finishDraft(d, flags, report, url);
}

async function importText(text, url, titleHint){
  const caption = cleanCaption(text);
  if (!caption && !url) { toast('Füge zuerst einen Link oder Rezepttext ein.'); return; }
  if (!caption) { // nur Link, kein Text
    ui.view = 'import'; ui.importUrl = url; render();
    toast('Beschreibung konnte nicht geladen werden – bitte Text einfügen.');
    return;
  }
  let res, err = '';
  if (state.settings.geminiKey) {
    const spin = openModal({cls:'small', html:`<div class="sheet-body" style="text-align:center"><div class="spinner" aria-hidden="true"></div><p><strong>Rezept wird gelesen…</strong><br><span class="lead">Gemini sortiert Zutaten und Schritte.</span></p></div>`});
    try { res = draftFromGemini(await geminiCall(`${G_PROMPT}\n\nSOURCE URL: ${url || '-'}\nVIDEO TITLE: ${titleHint || '-'}\n\nTEXT:\n${caption}`), caption, url); }
    catch (e) { err = e.message === 'NO_KEY' ? '' : e.message; }
    if (modalStack.length && modalStack[modalStack.length - 1].wrap.contains(spin)) closeModal();
  }
  if (!res) res = localParse(caption, url, titleHint);
  ui.lastReport = {title:res.draft.title, items:res.report, error:err};
  if (ui.view === 'import') render();
  const missingSteps = res.flags.has('steps');
  const n = res.draft.ingredients.filter(i => i._flag).length;
  const msg = [`📥 Importiert${state.settings.geminiKey && !err ? ' mit Gemini' : ''}.`];
  if (err) msg.push(`Gemini-Fehler: ${esc(err)} – einfacher Parser benutzt.`);
  if (n) msg.push(`<strong>${n} Zutat${n > 1 ? 'en' : ''}</strong> bitte prüfen.`);
  if (missingSteps) msg.push('<strong>Zubereitung fehlt</strong> – unten aus dem Kommentar einfügen.');
  if (!n && !missingSteps && !err) msg.push('Alles erkannt – kurz prüfen und speichern.');
  openForm(res.draft, {flags:[...res.flags].filter(f => !(state.settings.geminiKey && !err && f === 'difficulty')), banner:msg.join(' '), bannerType:(n || missingSteps || err) ? 'warn' : 'ok'});
}

async function applyFill(form){
  const ta = form.querySelector('#fill-text'), text = ta.value.trim();
  if (!text) { toast('Erst den Text einfügen.'); ta.focus(); return; }
  let steps = [];
  if (state.settings.geminiKey) {
    try { const g = await geminiCall(`${G_PROMPT}\n\nThe text below is the method part of a recipe (e.g. a pinned comment). Return its steps; ingredients may be empty.\n\nTEXT:\n${text}`); steps = g.steps || []; }
    catch (e) { toast('Gemini-Fehler: ' + e.message); }
  }
  if (!steps.length) steps = text.split(/\n+|(?=\b(?:step|schritt)\s*\d+)/i).map(l => l.replace(/^(step|schritt)\s*\d+\s*[.):-]?\s*/i, '').replace(/^\d+\s*[.):-]\s*/, '').trim()).filter(l => l.length > 3 && !/^(method|instructions?|directions?|zubereitung|anleitung|steps?)\b[^\p{L}]*$/iu.test(l));
  const list = form.querySelector('#step-list');
  [...list.children].forEach(li => { if (!li.querySelector('.s-text').value.trim()) li.remove(); });
  steps.forEach(t => list.appendChild(stepRowEl({text:t})));
  renumber(list);
  form.querySelector('[data-field="steps"]').classList.remove('flagged');
  form.querySelector('#fill-box').remove();
  toast(`✅ ${steps.length} Schritte übernommen`);
}

/* Aufruf durch den Kurzbefehl: …/#import?u=<Link>&t=<Treffer> */
function handleIncoming(){
  const h = location.hash;
  if (!h.startsWith('#import')) return;
  const params = new URLSearchParams(h.slice(h.indexOf('?') + 1));
  const url = (params.get('u') || '').trim(), raw = params.get('t') || '';
  history.replaceState(null, '', location.pathname + location.search);
  const {text, title} = pickCaption(raw);
  ui.importUrl = url; ui.importText = text;
  importText(text, url, title);
}

function exportBackup(){
  const data = JSON.stringify({...state, settings:{...state.settings, geminiKey:''}}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `rezepte-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  state.settings.lastBackup = new Date().toISOString(); save(); render();
  toast('💾 Backup erstellt (ohne API-Schlüssel)');
}
async function importBackup(file){
  try {
    const s = JSON.parse(await file.text());
    if (!s || !Array.isArray(s.recipes)) throw new Error('Keine gültige Backup-Datei');
    if (!await confirmDialog('Backup laden?', `${s.recipes.length} Rezepte ersetzen die aktuellen ${state.recipes.length}. Dein Gemini-Schlüssel bleibt.`, 'Laden', true)) return;
    const key = state.settings.geminiKey, model = state.settings.model;
    state = migrate(s); state.settings.geminiKey = key; state.settings.model = model;
    save(); render(); toast('✅ Backup geladen');
  } catch (e) { toast('⚠ ' + e.message); }
}

/* =========================================================
   MODALS
   ========================================================= */
const modalStack = [];
function openModal({html, cls = '', sticky = false, onClose}){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(wrap);
  modalStack.push({wrap, onClose, sticky, prevFocus:document.activeElement});
  if (!sticky) wrap.addEventListener('click', e => { if (e.target === wrap) closeModal(); });
  document.body.classList.add('modal-open');
  const dlg = wrap.firstElementChild;
  const h = dlg.querySelector('h2'); if (h) dlg.setAttribute('aria-label', h.textContent);
  setTimeout(() => { const f = dlg.querySelector('[autofocus]') || dlg.querySelector('input[type=search]') || dlg.querySelector('button'); if (f && !dlg.contains(document.activeElement)) f.focus({preventScroll:true}); }, 30);
  return dlg;
}
function closeModal(){
  const m = modalStack.pop(); if (!m) return;
  m.wrap.remove(); if (m.onClose) m.onClose();
  if (!modalStack.length) document.body.classList.remove('modal-open');
  if (m.prevFocus && document.contains(m.prevFocus)) m.prevFocus.focus({preventScroll:true});
}
function confirmDialog(title, msg, okLabel, danger){
  return new Promise(res => {
    let done = false;
    const dlg = openModal({cls:'small', onClose:() => { if (!done) res(false); }, html:`
      <div class="sheet-body"><h2 class="confirm-title">${esc(title)}</h2><p>${esc(msg)}</p>
      <div class="btn-row end"><button class="btn secondary" data-confirm="0">Abbrechen</button><button class="btn ${danger ? 'danger-solid' : 'primary'}" data-confirm="1" autofocus>${esc(okLabel)}</button></div></div>`});
    dlg.addEventListener('click', e => { const b = e.target.closest('[data-confirm]'); if (!b) return; done = true; res(b.dataset.confirm === '1'); closeModal(); });
  });
}

  }
};
function clearFieldState(el){ const f = el.closest('.field'); if (f) { f.classList.remove('flagged', 'invalid'); const e = f.querySelector(':scope > .err'); if (e) e.textContent = ''; } }

document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]');
  if (!a || a.disabled) return;
  const fn = actions[a.dataset.action];
  if (fn) { e.preventDefault(); fn(a, e); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; document.getElementById('lib-results').innerHTML = libraryResults(); }
  else if (e.target.id === 'pick-q') document.getElementById('pick-list').innerHTML = pickerList(e.target.value);
  else if (e.target.id === 'imp') ui.importText = e.target.value;
  else if (e.target.id === 'imp-url') ui.importUrl = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.dataset.gkey) { const k = e.target.dataset.gkey; if (e.target.checked) state.checked[k] = true; else delete state.checked[k]; save(); render(); }
  if (e.target.id === 'backup-file' && e.target.files[0]) importBackup(e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalStack.length && !modalStack[modalStack.length - 1].sticky) closeModal();
});
window.addEventListener('hashchange', handleIncoming);

render();
handleIncoming();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
